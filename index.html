<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Werka's Bouquet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='7' y='8' width='2' height='7' fill='%2315803d'/%3E%3Crect x='4' y='3' width='8' height='6' fill='%23f472b6'/%3E%3Crect x='6' y='1' width='4' height='10' fill='%23f472b6'/%3E%3Crect x='7' y='5' width='2' height='2' fill='%23fde047'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
      
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: -webkit-fill-available;
        overflow: hidden;
        position: fixed;
        touch-action: none;
      }
      
      body {
        font-family: 'VT323', monospace;
        background-color: #1a1a1a;
      }
      
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      /* Pixel art aesthetic utilities */
      .pixel-text {
        font-family: 'Press Start 2P', cursive;
      }
      
      canvas {
        image-rendering: pixelated; /* Crucial for the pixel art look */
      }
      
      /* Responsive game container */
      .game-container {
        position: relative;
        transform-origin: center center;
      }
      
      /* Mobile controls styling */
      .mobile-control-btn {
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.2);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.3);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
